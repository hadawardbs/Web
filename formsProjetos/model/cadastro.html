<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Jogador</title>
</head>
<body>
    <form action="/cadastro" method="post">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required>
        <br>
        <label for="apelido">Apelido</label>
        <input type="text" id="apelido" placeholder="Digite seu apelido" required>
        <br>
        <label for="idade">Idade</label>
        <input type="number" id="idade" placeholder="Digite sua idade" min="1" max="99" required>
        <br>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Digite seu email" required>
        <br>
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>
        <br>
        <label for="dataNascimento">Data de Nascimento</label>
        <input type="date" id="dataNascimento" required>
        <br>
        <p>Personagem Favorito</p>
        <select>
            <option value="">Nenhum</option>
            <option value="luna">🌚Luna</option>
            <option value="djabo">😈Djabo</option>
            <option value="berinja">🍆Berinja</option>
        </select>
        <br>
        <p>Escolha a dificudade</p>
        <input type="radio" id="facil" name="dificuldade" value="facil">
        <label for="facil">Fácil</label>
        <input type="radio" id="medio" name="dificuldade" value="medio">
        <label for="medio">Médio</label>
        <input type="radio" id="dificil" name="dificuldade" value="dificil">
        <label for="dificil">Difícil</label>
        <br>
        <p>Jogos Favoritos</p>
        <input type="checkbox" id="velha" value="velha">
        <label for="velha">Jogo da Velha</label>
        <input type="checkbox" id="sudoku" value="sudoku">
        <label for="sudoku">Sudoku</label>
        <input type="checkbox" id="albion" value="albion">
        <label for="albion">Albion Online</label>
        <br>
        <label for="comentario">Comentário</label>
        <textarea id="comentario" placeholder="Deixe um comentário" rows="5" cols="30"></textarea>
        <br>
        <button type="submit">➡️Cadastrar</button>
        <button type="reset">🗑️Limpar</button>
    </form>
</body>
</html>
